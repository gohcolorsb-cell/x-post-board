<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X投稿URLメーカー</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1a1d23;--sub:#667085;--line:#d9dde4;--accent:#1d9bf0;--ok:#12805c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--text:#eceef2;--sub:#98a1b0;--line:#323741;--accent:#4db3f5;--ok:#46c79a}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--text:#eceef2;--sub:#98a1b0;--line:#323741;--accent:#4db3f5;--ok:#46c79a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.25rem;margin:0 0 4px}
p.lead{margin:0 0 16px;color:var(--sub);font-size:.9rem}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:16px;resize:vertical}
textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--sub);font-size:.8rem;margin-top:4px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px}
.url{font-size:.8rem;word-break:break-all;color:var(--sub);max-height:4.8em;overflow:auto;margin-bottom:10px}
.row{display:flex;gap:8px}
.btn{flex:1;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.done{color:var(--ok);border-color:var(--ok)}
.empty{color:var(--sub);font-size:.9rem;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>X投稿URLメーカー</h1>
  <p class="lead">アフィリエイトリンクを貼ると、Xの投稿画面を開くURLに変換します。</p>

  <label for="links">アフィリエイトリンク(タグごと貼ってOK)</label>
  <textarea id="links" rows="4" placeholder="FANZAの広告コードをそのまま貼る"></textarea>
  <div class="hint">貼った中から http で始まるURLを抜き出し、af_id の末尾(例:-001)までに切ります。複数あれば1つずつ出ます。</div>

  <label for="text">投稿テキスト(任意・全リンク共通)</label>
  <textarea id="text" rows="3" placeholder="例:続きはこちら👇"></textarea>
  <div class="hint">リンクはテキストの後ろに自動で付きます。</div>

  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const out = $('out');

function build(link, text){
  const p = new URLSearchParams();
  if (text) p.set('text', text);
  p.set('url', link);
  return 'https://x.com/intent/post?' + p.toString();
}

function render(){
  const found = $('links').value.match(/https?:\/\/[^\s"'<>]+/g) || [];
  const links = [...new Set(found.map(s => {
    s = s.replace(/&amp;/g, '&');
    const m = s.match(/^.*?af_id=[^&\s"'<>]+/);
    return m ? m[0] : s;
  }))];
  const text = $('text').value.trim();
  out.innerHTML = '';
  if (!links.length){
    out.innerHTML = '<div class="empty">リンクを貼ると、ここにURLが出ます。</div>';
    return;
  }
  links.forEach(link => {
    const u = build(link, text);
    const el = document.createElement('div');
    el.className = 'item';
    const d = document.createElement('div');
    d.className = 'url';
    d.textContent = u;
    const row = document.createElement('div');
    row.className = 'row';
    const open = document.createElement('a');
    open.className = 'btn primary';
    open.textContent = 'Xで開く';
    open.href = u;
    open.target = '_blank';
    open.rel = 'noopener';
    const mkCopy = (label, value) => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = label;
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(value); }
        catch(e){
          const t = document.createElement('textarea');
          t.value = value; document.body.appendChild(t); t.select();
          try{ document.execCommand('copy'); }catch(_){}
          t.remove();
        }
        b.textContent = 'コピーしました';
        b.classList.add('done');
        setTimeout(() => { b.textContent = label; b.classList.remove('done'); }, 1500);
      };
      return b;
    };
    const copy = mkCopy('X用URLをコピー', u);
    const copyLink = mkCopy('リンクだけコピー', link);
    const lk = document.createElement('div');
    lk.className = 'url';
    lk.textContent = link;
    const row2 = document.createElement('div');
    row2.className = 'row';
    row2.style.marginTop = '8px';
    row.append(open, copy);
    row2.append(copyLink);
    el.append(lk, row, row2);
    out.append(el);
  });
}

$('links').addEventListener('input', render);
$('text').addEventListener('input', render);
render();
</script>
</body>
</html>
